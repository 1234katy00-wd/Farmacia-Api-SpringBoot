spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/farmacia_db
    username: user_db
    password: pass_db
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 0

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

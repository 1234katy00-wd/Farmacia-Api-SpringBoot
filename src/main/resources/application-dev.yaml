spring:
    datasource:
        url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:farmacia_db}
        username: ${DB_USER:user_db}
        password: ${DB_PASSWORD:pass_db}
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update # actualiza automaticamente
        show-sql: true
        properties:
            hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
    
    springdoc:
        api-docs:
            path: /api-docs
            enabled: true
        swagger-ui:
            path: /swagger-ui.html
            enabled: true

    server:
        port: ${SERVER_PORT:8080}

services:
  db: 
    image: postgres:16-alpine
    container_name: pg-farmacia
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-farmacia_db}
      POSTGRES_USER: ${DB_USER:-user_db}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

